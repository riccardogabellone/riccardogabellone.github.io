<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>
  @font-face {
    font-family: 'Space Grotesk';
    src: url('../src/assets/fonts/space-grotesk-latin-700-normal.woff2') format('woff2');
    font-weight: 700;
  }
  @font-face {
    font-family: 'Inter';
    src: url('../src/assets/fonts/inter-latin-400-normal.woff2') format('woff2');
    font-weight: 400;
  }
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('../src/assets/fonts/jetbrains-mono-latin-700-normal.woff2') format('woff2');
    font-weight: 700;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background:
      radial-gradient(560px 400px at 8% -10%, rgba(176, 110, 8, 0.16), transparent 65%),
      radial-gradient(620px 460px at 100% 6%, rgba(42, 108, 176, 0.16), transparent 65%),
      linear-gradient(150deg, #111a25 0%, #0d141c 60%);
    color: #e8edf3;
    display: flex; align-items: center; justify-content: space-between;
    font-family: Inter, system-ui, sans-serif;
    position: relative; overflow: hidden;
  }
  .lightbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 10px;
    background: linear-gradient(90deg, #b06e08, #16202c 50%, #2a6cb0);
  }
  .wrap { padding: 80px; }
  .kicker { font-family: 'JetBrains Mono', monospace; font-size: 26px; color: #8593a1; }
  .kicker b { color: #e29b2d; }
  h1 { margin-top: 20px; font-family: 'Space Grotesk', sans-serif; font-size: 84px; letter-spacing: -2px; }
  p.head { margin-top: 18px; font-size: 34px; color: #b9c4d0; max-width: 640px; line-height: 1.3; }
  p.dom { margin-top: 46px; font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 700; color: #e29b2d; }
  .photo-side { padding-right: 110px; }
  .photo {
    width: 300px; height: 300px; border-radius: 50%; object-fit: cover;
    border: 6px solid #b06e08;
    box-shadow: -24px 18px 80px -30px rgba(176, 110, 8, 0.65),
                24px -18px 80px -30px rgba(42, 108, 176, 0.65),
                0 0 0 14px #16202c;
  }
</style></head><body>
  <div class="wrap">
    <p class="kicker"><b>//</b> software engineer</p>
    <h1>Riccardo Gabellone</h1>
    <p class="head">Backend &amp; Distributed Systems — Python, Rust, and privacy-first AI products.</p>
    <p class="dom">riccardogabellone.github.io</p>
  </div>
  <div class="photo-side"><img class="photo" src="../public/images/riccardo.jpg" alt=""></div>
  <div class="lightbar"></div>
</body></html>
