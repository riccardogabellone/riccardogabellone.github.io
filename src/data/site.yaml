    end: 07/2026
    bullets:
      - Delivered the company's public site (React, TypeScript) and its lead-intake APIs on Supabase Edge Functions, with Cloudflare Turnstile, rate limiting and consent-gated analytics
      - Redesigned and rewrote the car-rental back-office ERP on a modern stack with e-invoicing and LLM-powered features, and scripted the legacy platform migration; in daily production use
  - kind: work
    title: Software Engineer
    org: Boring Stuff S.r.l.
    org_url: https://www.boringstuff.xyz/
    start: 09/2022
    end: 04/2026
    bullets:
      - Architected microservices for a 50+ service ERP platform on AWS (EKS) and Kubernetes (hundreds of req/s, thousands of users), growing from single services to owning infrastructure as code (Terraform) and custom CI pipelines
      - Developed backend services in Python (FastAPI) and Rust with sync and async communication over gRPC, RabbitMQ, Kafka (Redpanda) and Redis, backed by unit and integration test suites
      - "Designed and built platform-wide authentication in Python and Rust: SRP-6a zero-knowledge login, TOTP MFA, OAuth2 SSO, single-use refresh tokens and revocable JWTs checked at the gateway for ~45 services"
      - Co-built the Rust API gateway in front of every service, adding Redis rate limiting, IP banning and request logging to Kafka, built on tokio and tower with a custom radix-tree router
      - "Built platform-wide webhook delivery on the gateway: event capture with no per-service code, idempotent at-least-once delivery with retries, dead-lettering, replay and HMAC signing"
      - Created an internal Rust proc-macro framework used by 16 services, generating routes, request validation and OpenAPI docs at compile time
      - Migrated cross-service record relationships to a Memgraph graph behind a Rust gRPC service, with saga-style compensating rollbacks over RabbitMQ, used by 19 microservices
      - Led a self-validating production scheduler in Rust (~7k LOC) for NP-hard job-shop planning, re-checking 9 invariants on every plan
      - Shipped semantic search with self-hosted embedding inference over gRPC and pgvector HNSW indexes, kept in sync with PostgreSQL writes by event-driven workers
      - Optimized PostgreSQL for high-volume workloads and implemented an RFC 5545 recurrence engine (Python and Rust) with range-indexed queries and O(n+m) conflict detection, used by 6+ services
      - Co-developed and maintained the in-house Rust CLI (clap, tokio, kube-rs) that builds multi-arch Docker images and Helm-deploys ~50 microservices to Kubernetes
      - Integrated customers' legacy systems with the platform, mainly in Python
