- id: photostacker
  title: photostacker
  tagline: Offline desktop app and CLI in Rust that stacks exposure brackets and bursts
  description: >-
    Finds exposure brackets, HDR sets and bursts in a folder of photos and
    stacks each as layers in one PSD, PSB or layered TIFF. Rewritten in Rust
    from the original Python web app: an EXIF → perceptual-hash funnel with an
    opt-in DINOv2 ONNX check on ambiguous stacks, a custom EXIF parser and
    PSD/TIFF encoders, resumable jobs in SQLite, and CI-built packages for
    Linux, Windows and macOS. MIT-licensed.
  tech: [Rust, DINOv2, ONNX Runtime, SQLite]
  links:
    repo: https://github.com/riccardogabellone/photostacker
  status: listed
  order: 4
