- id: vital-causality
  title: Vital Causality
  tagline: Privacy-first health diary with on-device AI
  description: >-
    Built entirely solo: idea, UX, Android app, backend and infrastructure.
    Health data is special-category under GDPR, so the app is privacy-first:
    possible correlations between health events come from a statistical
    causality engine on the phone, records sit in encrypted local storage with
    end-to-end encrypted backups, and on-device inference runs stock Gemma
    models via LiteRT-LM. Heavier features go through a separate FastAPI gateway
    on Cloud Run for MedGemma, and those do send data off the device. Live on
    Google Play, currently Europe-only.
  tech: [Kotlin, Android, On-device LLM, FastAPI, GCP]
  links:
    live: https://vitalcausality.app
  status: featured
  order: 1
